services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_ogas
      POSTGRES_USER: mini_ogas
      POSTGRES_PASSWORD: mini_ogas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  central-api:
    build: ../services/central-api
    env_file:
      - ./env.central.example
    environment:
      ALLOW_LEGACY_NODE_TOKEN_AUTH: "false"
      NODE_CREDENTIALS_JSON: >-
        {"turning-workshop-01":"${TURNING_NODE_TOKEN:-replace_turning_node_token_000000000000}","milling-workshop-01":"${MILLING_NODE_TOKEN:-replace_milling_node_token_000000000000}","grinding-workshop-01":"${GRINDING_NODE_TOKEN:-replace_grinding_node_token_000000000000}"}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - nats

  ai-dispatcher:
    build: ../services/ai-dispatcher
    env_file:
      - ./env.central.example
    ports:
      - "8081:8081"

  market-simulator:
    build: ../services/market-simulator
    env_file:
      - ./env.central.example
    ports:
      - "8082:8082"

  production-planner:
    build: ../services/production-planner
    env_file:
      - ./env.central.example
    ports:
      - "8083:8083"

  dashboard:
    build: ../services/dashboard
    ports:
      - "5173:5173"
    depends_on:
      - central-api

volumes:
  postgres_data:
