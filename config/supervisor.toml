[[process]]
name = "turning-simpy-node"
command = "python"
args = ["services/node-agent/simulator.py"]
dir = "."
depends_on = ["central-api"]
[process.env]
NODE_CODE = "turning-workshop-01"
WORKSHOP_TYPE = "turning"
CENTRAL_API_URL = "http://127.0.0.1:8080"
OGAS_API_TOKEN = "${OGAS_API_TOKEN}"
LOCAL_DB_PATH = 'D:\MiniOGAS-VMs\vm-turning-workshop-01\node.db'
HEARTBEAT_SEC = "5"
EMERGENCY_AFTER_TICKS = "18"
SIMULATION_MODE = "normal"
SIMULATION_ENGINE = "simpy"
SIMULATION_SPEED = "1"
SIMULATION_RANDOM_SEED = "20260611"
OGAS_RUN_ID = "${OGAS_RUN_ID}"
OGAS_SCENARIO_ID = "SCN-TURNING-SIMPY-FLOW-001"
NODE_DEPLOYMENT_MODE = "process"
[process.health]
type = "process"
interval = 10
timeout = 5
retries = 3

