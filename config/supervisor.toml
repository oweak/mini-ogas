[[process]]
name = "cloud-db-agent"
command = "python"
args = ["-u", "services/node-agent/agent.py", "--node-code", "cloud-db-01", "--workshop-type", "database", "--interval", "3", "--api-url", "http://127.0.0.1:8080", "--token", "mini-ogas-dev-token"]
