session_token_auto = true
api_port = 9099

[[process]]
name = "central-api"
command = "python"
args = ["-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8080", "--log-level", "warning"]
dir = "services/central-api"
[process.env]
OGAS_API_TOKEN = "${OGAS_API_TOKEN}"
API_ACCESS_TOKEN = "${API_ACCESS_TOKEN}"
NODE_INGEST_TOKEN = "${NODE_INGEST_TOKEN}"
PERSIST_ENABLED = "true"
PERSIST_BACKEND = "postgres"
POSTGRES_DSN = "${POSTGRES_DSN}"
MICROSERVICES_ENABLED = "true"
JWT_SECRET = "${JWT_SECRET}"
AUTH_BOOTSTRAP_PASSWORD = "${AUTH_BOOTSTRAP_PASSWORD}"
[process.health]
type = "http"
endpoint = "http://127.0.0.1:8080/health"
interval = 5
timeout = 3
retries = 5

[[process]]
name = "ai-dispatcher"
command = "python"
args = ["-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8081", "--log-level", "warning"]
dir = "services/ai-dispatcher"
depends_on = ["central-api"]
[process.env]
API_ACCESS_TOKEN = "${API_ACCESS_TOKEN}"
[process.health]
type = "http"
endpoint = "http://127.0.0.1:8081/health"
interval = 5
timeout = 3
retries = 5

