args = ["-u", "services/node-agent/agent.py", "--node-code", "cloud-workshop-01", "--workshop-type", "cloud", "--interval", "3", "--api-url", "http://127.0.0.1:8080", "--token", "mini-ogas-dev-token"]
dir = "."
